<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="only light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Armonia · Ferrara</title>
<meta name="description" content="Regala un angolo di torre nella serra di ricerca dell'Università di Ferrara: raccolto ogni giovedì, nichel testato.">
<meta property="og:type" content="website">
<meta property="og:title" content="Armonia: regala qualcosa che cresce">
<meta property="og:description" content="Un angolo di torre nella serra di ricerca dell'Università di Ferrara. Raccolto ogni giovedì, nichel testato.">
<meta property="og:image" content="og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
<script>
/* Configurazione AI. Su Netlify lascia apiKey vuota: la key sta nella funzione /api/chat.
   apiKey qui solo per una prova veloce in locale: chi apre la pagina puo' leggerla. */
window.ARMONIA_CONFIG = window.ARMONIA_CONFIG || { proxyUrl: "/api/chat", apiKey: "", model: "claude-haiku-5-5", apiVersion: "2023-06-01" };
</script>
<style>
:root{
  /* Voice: serio, da centro di ricerca agraria. Idea: il quaderno di campo e la scheda di laboratorio.
     Colori: carta bianca, inchiostro verde scuro, verde campo, grano come accento, blu laboratorio per il nichel. */
  --bg:#FFFFFF; --alt:#F3F5F1; --panel:#FFFFFF; --ink:#1B2A24; --ink-soft:#56645E;
  --leaf:#2E6B45; --leaf-dark:#24563A; --field:#1F3A2E; --hydro:#355F7A; --hydro-soft:#E6EDF2;
  --berry:#B23A48; --sun:#D9C58A; --line:#DCE2DC;
  --display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --body:"Source Sans 3", "Segoe UI", Helvetica, Arial, sans-serif;
  --r-s:4px; --r-m:6px; --r-l:8px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;overflow-x:hidden;max-width:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;max-width:100%;overflow-wrap:break-word;background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--body);overflow-x:clip}
img,svg{display:block}
a{color:var(--hydro)}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.1;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:clamp(28px,3.6vw,40px);font-weight:600}
h3{font-size:20px;font-weight:600;letter-spacing:0}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--hydro);outline-offset:2px;border-radius:4px}
.wrap{max-width:1160px;margin:0 auto;padding:0 22px}
.lead{font-size:19px;color:var(--ink-soft);max-width:60ch}
section{padding:72px 0}
.sec-head{display:grid;gap:12px;margin-bottom:32px;max-width:720px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;min-height:44px;
  font-weight:600;border-radius:4px;padding:13px 22px;background:var(--leaf);color:#fff;text-decoration:none;transition:background .15s}
.btn:hover{background:var(--leaf-dark)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.ghost:hover{background:rgba(19,48,42,.06)}
.btn.small{padding:9px 16px;font-size:15px}
.btn.berry{background:var(--berry)}
.btn.berry:hover{background:#962F3B}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* header */
header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:18px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand b{font:600 23px/1 var(--display)}
.brand small{display:block;font-size:12px;color:var(--ink-soft);line-height:1.2}
nav.main{display:flex;gap:4px;margin-left:auto}
nav.main a{color:var(--ink);text-decoration:none;font-weight:600;font-size:15px;padding:8px 10px;border-radius:4px}
nav.main a:hover{background:var(--alt)}
.tools{display:flex;gap:8px;align-items:center}
.lang{display:flex;border-radius:4px;box-shadow:inset 0 0 0 1.5px var(--line);padding:3px}
.lang button{border:0;background:none;padding:5px 10px;border-radius:4px;font-weight:700;font-size:14px;cursor:pointer;color:var(--ink-soft)}
.lang button[aria-pressed="true"]{background:var(--field);color:#fff}
.cart-btn{position:relative;border:0;background:var(--field);color:#fff;border-radius:4px;padding:9px 14px;font-weight:700;cursor:pointer;display:flex;gap:8px;align-items:center}
.cart-btn .count{background:var(--berry);border-radius:4px;min-width:22px;height:22px;display:grid;place-items:center;font-size:13px;padding:0 6px}
.subnav{display:none}
.drawer-foot{grid-template-columns:minmax(0,1fr)}
.drawer-foot select{width:100%}
.bot input{min-width:0}
.table-wrap{overflow-x:auto}
@media (max-width:900px){
  nav.main{display:none}
  .tools{margin-left:auto}
  .subnav{display:flex;gap:6px;overflow-x:auto;padding:0 22px 10px;scrollbar-width:none}
  .subnav a{flex:none;font-size:14px;font-weight:700;text-decoration:none;color:var(--ink);padding:6px 12px;border-radius:4px;box-shadow:inset 0 0 0 1.5px var(--line)}
  .brand small{display:none}
  .cart-btn .lbl{display:none}
  .bar{gap:10px}
  section{padding:56px 0}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .product .art{height:92px}
  .product .art svg{width:72px;height:72px}
  .product .body{padding:12px}
  .product .foot{padding:0 12px 12px;flex-wrap:wrap;gap:8px}
  .product h3{font-size:18px}
  .rewards div{padding-right:12px}
}

/* hero */
.hero{position:relative;overflow:hidden;padding:64px 0 72px;border-bottom:1px solid var(--line);background:var(--alt)}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.25fr .75fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(40px,5.6vw,68px);font-weight:600;letter-spacing:-.02em;line-height:1.04;max-width:13ch}
.hero .lead{margin-top:22px}
.hero .ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.facts{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:36px;padding:20px 0 0;border-top:1px solid var(--line);list-style:none;font-weight:600;font-size:15px}
.facts li{display:flex;gap:8px;align-items:center}
.facts svg{flex:none}
/* plant cards on the tower */
.tw .pl{transition:opacity .2s ease}
.tw.focus .pl:not(.on){opacity:.3}
.tw.focus .lbl:not(.on){opacity:.35}
.tw .lbl{transition:opacity .2s ease;cursor:pointer}
.tw .pl.hot,.tw .hotdot{cursor:pointer;outline:none}
.tw .halo{opacity:0;transition:opacity .2s ease}
.tw .pl.on .halo,.tw .pl.hot:focus-visible .halo{opacity:1}
.tw .pulse{transform-box:fill-box;transform-origin:center;animation:twpulse 2.4s ease-out infinite}
.tw.focus .pulse{animation:none;opacity:0}
@keyframes twpulse{0%{transform:scale(.7);opacity:.95}80%,100%{transform:scale(2.3);opacity:0}}
@media (prefers-reduced-motion:reduce){.tw .pulse{animation:none;opacity:.6}}
.hint{font-size:13px;opacity:.75}
#legend{flex-direction:column;align-items:center;gap:2px}
.ptip{position:fixed;z-index:60;width:272px;background:#fff;color:var(--ink);border-radius:16px;box-shadow:0 18px 44px rgba(16,32,24,.22),0 2px 6px rgba(16,32,24,.08);padding:16px 16px 14px;pointer-events:none;opacity:0;transform:translateY(6px);transition:opacity .16s ease,transform .16s ease}
.ptip.on{opacity:1;transform:none}
.ptip-head{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center}
.ptip-ic{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#F4F8F2,#E2ECDF);display:grid;place-items:center;overflow:hidden}
.ptip-ic svg{width:50px;height:50px}
.ptip b.n{display:block;font:600 20px/1.15 "Source Serif 4",Georgia,serif}
.ptip i.l{display:block;font-size:14px;color:var(--ink-soft);margin-top:2px}
.ptip-grow{margin-top:14px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px;color:var(--ink-soft)}
.ptip-grow b{font-size:16px;color:var(--leaf)}
.ptip-bar{position:relative;height:8px;border-radius:4px;background:#EDF1EC;margin-top:8px;overflow:hidden}
.ptip-bar i{position:absolute;top:0;bottom:0;border-radius:4px}
.ptip-scale{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin-top:4px}
.ptip p{margin:10px 0 0;font-size:14px;line-height:1.4}
.ptip .chip2{display:inline-block;margin-top:10px;font-size:13px;font-weight:600;color:var(--leaf);background:#EEF4EE;border-radius:999px;padding:3px 10px}
#rentTower svg,#liveTower svg{max-width:100%;height:auto;display:block;margin:0 auto}
.hero-tower{justify-self:center;display:grid;gap:10px;justify-items:center}
.hero-tower p{font-size:14px;color:var(--ink-soft);text-align:center;max-width:24ch}
@media (max-width:820px){.hero .wrap{grid-template-columns:1fr}.hero-tower{display:none}}

/* how */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;border-top:1px solid var(--ink);padding-top:16px;display:grid;gap:8px}
.steps li::before{content:counter(s);font:600 30px/1 var(--display);color:var(--leaf)}
.steps p{color:var(--ink-soft)}
@media (max-width:760px){.steps{grid-template-columns:1fr}}

/* shop */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.chip{border:0;cursor:pointer;padding:8px 14px;font-weight:600!important;border-radius:4px;background:var(--panel);box-shadow:inset 0 0 0 1.5px var(--line);font-weight:700;font-size:15px}
.chip[aria-pressed="true"]{background:var(--field);color:#fff;box-shadow:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.product{background:var(--panel);border-radius:var(--r-m);border:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.product .art{height:118px;display:grid;place-items:center;position:relative}
.product .tag{position:absolute;top:10px;left:10px;font-size:13px;font-weight:700;background:#fff;border-radius:4px;padding:3px 10px}
.product .body{padding:16px;display:grid;gap:6px;flex:1}
.product .fmt{color:var(--ink-soft);font-size:15px}
.product .foot{display:flex;align-items:center;justify-content:space-between;padding:0 16px 16px}
.price{font:600 22px/1 var(--display);white-space:nowrap}
.price small{font:400 14px var(--body);color:var(--ink-soft)}
.nickel{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:700;color:var(--hydro)}

/* plans */
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-items:stretch}
.plan{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);padding:24px;display:flex;flex-direction:column;gap:14px}
.plan > button{margin-top:auto}
.plan.feature{background:var(--field);color:#fff;border-color:var(--field)}
.plan.feature .muted{color:rgba(255,255,255,.75)}
.plan ul{margin:0;padding-left:20px;display:grid;gap:4px}
.plan .price{font-size:34px}
.save{font-size:14px;font-weight:700;color:var(--leaf)}
.plan.feature .save{color:var(--sun)}
.addon{margin-top:18px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;background:#F7ECEC;border-radius:var(--r-m);padding:18px 22px}
@media (max-width:860px){.plans{grid-template-columns:1fr}}
.muted{color:var(--ink-soft)}

/* bundles */
.bundle{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);padding:20px;display:grid;gap:10px;align-content:start}
.bundle .row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px}
.strike{text-decoration:line-through;color:var(--ink-soft);font-size:15px;margin-left:6px}

/* rent: the signature piece */
#noleggio{background:var(--field);color:#fff}
#noleggio .lead{color:rgba(255,255,255,.78)}
.rent{display:grid;grid-template-columns:340px 1fr;gap:48px;align-items:start}
.tower-stage{position:sticky;top:84px;max-height:calc(100vh - 96px);overflow:auto;display:grid;justify-items:center;gap:14px;background:rgba(255,255,255,.05);border-radius:var(--r-l);padding:22px 18px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center;font-size:14px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:12px;height:12px;border-radius:50%;display:inline-block}
.cfg{display:grid;gap:30px}
.cfg fieldset{border:0;margin:0;padding:0;display:grid;gap:12px}
.cfg legend{font:600 21px var(--display);margin-bottom:12px;padding:0}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.opt{position:relative}
.opt input{position:absolute;opacity:0}
.opt label{display:grid;gap:2px;padding:14px 16px;border-radius:var(--r-s);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.25);cursor:pointer;height:100%}
.opt label b{font-size:17px}
.opt label span{font-size:14px;color:rgba(255,255,255,.72)}
.opt input:checked + label{box-shadow:inset 0 0 0 2.5px var(--sun);background:rgba(240,185,58,.1)}
.opt input:focus-visible + label{outline:3px solid var(--sun);outline-offset:2px}
.opt input:disabled + label{opacity:.4;cursor:not-allowed}
.crops{display:flex;flex-wrap:wrap;gap:8px}
.crop{border:0;cursor:pointer;border-radius:4px;padding:8px 14px 8px 10px;display:inline-flex;gap:8px;align-items:center;font-weight:700;font-size:15px;background:rgba(255,255,255,.08);color:#fff}
.crop i{width:14px;height:14px;border-radius:50%}
.crop[aria-pressed="true"]{background:#fff;color:var(--ink)}
.range-row{display:flex;gap:14px;align-items:center}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:34px;flex:1;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:rgba(255,255,255,.28)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-10px;border-radius:50%;background:var(--sun);border:3px solid #fff}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:rgba(255,255,255,.28)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--sun);border:3px solid #fff}
input[type=range]:focus-visible{outline:2px solid var(--sun);outline-offset:4px}
.field{display:grid;gap:6px}
.field input,.field select,.field textarea{padding:11px 13px;border-radius:var(--r-s);border:1.5px solid var(--line);background:#fff;color:var(--ink)}
#noleggio .field input{border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:#fff}
.summary{border-top:1px solid rgba(255,255,255,.2);padding-top:22px;display:flex;flex-wrap:wrap;gap:18px;align-items:end;justify-content:space-between}
.summary .price{font-size:42px;color:#fff}
.summary .price small{color:rgba(255,255,255,.7)}
.fine{font-size:14px;color:rgba(255,255,255,.7);max-width:46ch}
@media (max-width:900px){.rent{grid-template-columns:1fr}.tower-stage{position:static}}

/* request */
.request{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
.form{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);padding:24px;display:grid;gap:14px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ok{background:#E3F3E8;color:var(--leaf-dark);border-radius:var(--r-s);padding:12px 14px;font-weight:700}
.process{margin:0;padding-left:22px;display:grid;gap:10px;color:var(--ink-soft)}
.process b{color:var(--ink)}
@media (max-width:860px){.request{grid-template-columns:1fr}}

/* rewards */
.rewards{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--ink)}
.rewards div{padding:18px 18px 4px 0;display:grid;gap:6px}
.rewards b{font:600 24px/1.1 var(--display)}
.rewards p{color:var(--ink-soft);font-size:16px}
@media (max-width:860px){.rewards{grid-template-columns:1fr}}

/* unife */
#unife{background:var(--hydro);color:#fff}
#unife .lead{color:rgba(255,255,255,.82)}
.unife{display:grid;grid-template-columns:1.1fr .9fr;gap:44px;align-items:start}
.unife ul{list-style:none;margin:0;padding:0;display:grid;gap:18px}
.unife li{display:grid;grid-template-columns:42px 1fr;gap:14px;align-items:start}
.unife li svg{background:rgba(255,255,255,.14);border-radius:10px;padding:8px;width:42px;height:42px}
.unife li p{color:rgba(255,255,255,.8);font-size:16px}
.ticket{background:#fff;color:var(--ink);border-radius:var(--r-m);padding:24px;display:grid;gap:12px}
.ticket .when{font:600 28px/1.1 var(--display)}
.ticket .code{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ticket input{flex:1;min-width:180px;padding:11px 13px;border-radius:var(--r-s);border:1.5px solid var(--line);background:#fff;color:var(--ink);font:inherit}
:root{color-scheme:only light}
:where(input:not([type=range]):not([type=radio]):not([type=checkbox]),select,textarea){background-color:#fff;color:#1B2A24}
@media (max-width:860px){.unife{grid-template-columns:1fr}}

/* nickel */
.lab{display:grid;grid-template-columns:.9fr 1.1fr;gap:40px;align-items:start}
table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:var(--r-m);overflow:hidden;border:1px solid var(--line);font-size:16px}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line)}
th{font-size:14px;color:var(--ink-soft);font-weight:600;background:var(--alt)}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;border-radius:4px;padding:2px 10px;font-size:13px;font-weight:700;background:var(--hydro-soft);color:var(--hydro)}
.note{font-size:14px;color:var(--ink-soft);margin-top:10px}
@media (max-width:860px){.lab{grid-template-columns:1fr}}

/* pickup */
.points{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.point{border-left:4px solid var(--leaf);padding:4px 0 4px 16px;display:grid;gap:4px}
.point p{color:var(--ink-soft)}
@media (max-width:760px){.points{grid-template-columns:1fr}}

/* rules */
details{border-bottom:1px solid var(--line);padding:14px 0}
summary{cursor:pointer;font-weight:600;font-size:18px;list-style:none;display:flex;justify-content:space-between;gap:12px}
summary::after{content:"+";font:600 22px/1 var(--display);color:var(--leaf)}
details[open] summary::after{content:"–"}
details p{margin-top:8px;color:var(--ink-soft);max-width:70ch}

footer{background:var(--field);color:rgba(255,255,255,.8);padding:40px 0 110px;font-size:15px}
footer .wrap{display:grid;gap:10px}
footer b{color:#fff}

/* gift card */
.giftcard{width:100%;max-width:300px;background:#fff;color:var(--ink);border-radius:var(--r-m);padding:18px;display:grid;gap:6px;box-shadow:0 14px 34px rgba(0,0,0,.28)}
.gc-top{display:flex;justify-content:space-between;align-items:center}
.gc-kicker{font-size:13px;color:var(--berry);font-weight:600}
.gc-for{font:600 26px/1.1 var(--display)}
.gc-name{font-weight:600;color:var(--leaf)}
.gc-what{font-size:15px;color:var(--ink-soft)}
.gc-msg{font-style:italic;font-size:15px}
.gc-foot{display:flex;gap:12px;align-items:center;border-top:1px dashed var(--line);padding-top:10px;margin-top:4px;font-size:13px;color:var(--ink-soft)}
.gc-qr{flex:none;width:84px;height:84px}
.gc-qr img,.gc-qr canvas{width:84px!important;height:84px!important}
#noleggio textarea{border:1.5px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:#fff;padding:11px 13px;border-radius:var(--r-s);font:inherit}
.giftfields{display:grid;gap:14px;max-width:520px}
/* live tower */
#torre{background:var(--alt);border-bottom:1px solid var(--line)}
.live{display:grid;grid-template-columns:250px minmax(0,1fr);gap:32px;align-items:start}
.live-tower{background:#fff;border:1px solid var(--line);border-radius:var(--r-m);padding:18px;display:grid;justify-items:center;gap:6px}
.live-main{display:grid;gap:16px}
.metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.metric{background:#fff;border:1px solid var(--line);border-radius:var(--r-s);padding:12px}
.metric span{display:block;font-size:13px;color:var(--ink-soft)}
.metric b{font:600 22px/1.2 var(--display);white-space:nowrap}
.chart,.report{background:#fff;border:1px solid var(--line);border-radius:var(--r-m);padding:16px 18px}
.chart-head,.report-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
#growth{width:100%;height:auto;display:block}
#reportText{font-size:17px;max-width:70ch;white-space:pre-line}
.next{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.next div{background:#fff;border:1px solid var(--line);border-radius:var(--r-s);padding:10px 12px;display:grid}
.next span{color:var(--ink-soft);font-size:15px}
@media (max-width:900px){.live{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.next{grid-template-columns:1fr}}
.stock{font-size:13px;color:var(--ink-soft)}
.stock.low{color:var(--berry);font-weight:600}
.pick{display:grid;font-size:15px}
.two-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.two-in input{width:100%;min-width:0;box-sizing:border-box}
.drawer .two-in{grid-template-columns:minmax(0,1fr)}
[hidden]{display:none!important}

/* area CIAS */
#cias{border-top:1px solid var(--line)}
.cias{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r-m);padding:18px;display:grid;gap:12px}
.stack{display:grid;gap:18px}
.copyrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.copyrow .note{margin:0;flex:1 1 200px}
.panel td{padding:7px 14px}
.panel input[type=number]{width:76px;padding:5px 10px;border:1.5px solid var(--line);border-radius:var(--r-s);font:inherit}
.msgbox{white-space:pre-line;overflow-wrap:anywhere;background:var(--alt);border-radius:var(--r-s);padding:14px 16px;font-size:16px;margin:0}
.wa{background:#1F7A4D}
.wa:hover{background:#18623E}
@media (max-width:860px){.cias{grid-template-columns:minmax(0,1fr)}}
.panel,.stack{min-width:0}

/* cart drawer */
.scrim{position:fixed;inset:0;background:rgba(27,42,36,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--alt);z-index:50;display:none;flex-direction:column}
.drawer.on{display:flex;animation:drawerIn .25s ease}
@keyframes drawerIn{from{transform:translateX(100%)}to{transform:none}}
.drawer-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.drawer-body{flex:1;overflow:auto;padding:18px 20px;display:grid;gap:14px;align-content:start}
.drawer-foot{padding:18px 20px;border-top:1px solid var(--line);display:grid;gap:12px;background:#fff}
.x{border:0;background:none;font-size:28px;line-height:1;cursor:pointer;padding:4px 8px}
.line{display:grid;grid-template-columns:1fr auto;gap:4px 12px;background:#fff;border-radius:var(--r-s);padding:12px 14px;border:1px solid var(--line)}
.line .meta{font-size:14px;color:var(--ink-soft)}
.qty{display:flex;align-items:center;gap:8px}
.qty button{border:0;width:32px;height:32px;border-radius:4px;background:var(--alt);cursor:pointer;font-weight:700}
.free{background:#E3F3E8;border-color:transparent}
.progress{display:grid;gap:6px;font-size:14px}
.progress .track{height:8px;border-radius:4px;background:rgba(19,48,42,.1);overflow:hidden}
.progress .fill{height:100%;background:var(--sun);border-radius:4px;transition:width .3s}
.totals{display:grid;gap:4px;font-size:16px}
.totals div{display:flex;justify-content:space-between}
.totals .grand{font:600 22px var(--display)}
.empty{text-align:center;color:var(--ink-soft);padding:30px 10px;display:grid;gap:14px;justify-items:center}

/* modal */
.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:60;padding:20px;pointer-events:none;opacity:0;transition:opacity .2s}
.modal.on{pointer-events:auto;opacity:1}
.modal .box{background:#fff;border-radius:var(--r-l);padding:30px;max-width:460px;width:100%;display:grid;gap:14px;box-shadow:0 20px 50px rgba(27,42,36,.25)}
.modal h3{font-size:28px}

/* assistant */
.bot-btn{position:fixed;right:18px;bottom:18px;z-index:35;border:0;cursor:pointer;background:var(--field);color:#fff;border-radius:4px;padding:14px 18px;font-weight:700;display:flex;gap:10px;align-items:center;box-shadow:0 6px 18px rgba(27,42,36,.22)}
.bot{position:fixed;right:18px;bottom:84px;z-index:36;width:min(380px,calc(100% - 36px));height:min(540px,calc(100% - 120px));background:#fff;border-radius:var(--r-l);box-shadow:0 16px 44px rgba(27,42,36,.25);display:none;flex-direction:column;overflow:hidden}
.bot.on{display:flex}
.bot-head{background:var(--field);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
.bot-head small{display:block;color:rgba(255,255,255,.7);font-size:13px}
.bot-head .x{color:#fff}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--alt)}
.msg{max-width:85%;padding:10px 14px;border-radius:6px;font-size:16px;line-height:1.45;white-space:pre-line}
.msg.me{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:4px}
.msg.it{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.typing{align-self:flex-start;color:var(--ink-soft);font-size:14px}
.quick{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px 0;background:#fff}
.quick button{border:0;background:var(--alt);border-radius:4px;padding:6px 11px;font-size:14px;font-weight:700;cursor:pointer}
.bot form{display:flex;gap:8px;padding:12px;background:#fff}
.bot input{flex:1;padding:11px 13px;border-radius:4px;border:1.5px solid var(--line)}
.bot form button{border:0;background:var(--leaf);color:#fff;border-radius:4px;padding:0 16px;font-weight:700;cursor:pointer}

.toast{position:fixed;left:50%;top:76px;white-space:nowrap;visibility:hidden;transform:translate(-50%,-160px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:4px;font-weight:700;z-index:70;transition:transform .25s}
.toast.on{transform:translate(-50%,0);visibility:visible}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- phone ---------- */
@media (max-width:900px){
  .tower-stage{max-height:none;overflow:visible}
}
@media (max-width:720px){
  section{padding:48px 0}
  .sec-head{margin-bottom:22px}
  .lead{font-size:18px}

  /* header slides away while reading, comes back when scrolling up */
  header{transition:transform .25s ease}
  header.away{transform:translateY(-100%)}
  .bar{height:58px}
  .lang button{min-width:40px;min-height:38px}
  .cart-btn{min-height:44px}
  .subnav a{padding:10px 14px}

  .hero{padding:40px 0 44px}
  .hero .ctas .btn{flex:1 1 100%}
  .facts{margin-top:28px}

  /* gift: smaller tower on top, the card sits right above the price */
  .tower-stage{padding:16px 12px;gap:10px}
  #rentTower svg{width:100%;max-width:360px;height:auto}
  .cfg .giftcard{max-width:none;margin:4px 0 22px}
  #liveTower svg{width:100%;max-width:360px;height:auto}

  /* shop: filters swipe sideways, products become compact rows */
  .filters{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -22px 18px;padding:2px 22px}
  .filters::-webkit-scrollbar{display:none}
  .chip{flex:none;min-height:42px}
  #products{grid-template-columns:minmax(0,1fr);gap:10px}
  #products .product{display:grid;grid-template-columns:88px minmax(0,1fr);grid-template-rows:auto auto}
  #products .art{grid-row:1 / 3;height:auto;align-content:center;gap:6px;border-bottom:0!important;border-right:1px solid var(--line)}
  #products .art svg{width:44px;height:44px}
  #products .tag{position:static;background:none;padding:0;font-size:13px;text-align:center;line-height:1.15;max-width:80px}
  #products .body{padding:12px 14px 4px;gap:2px}
  #products .product h3{font-size:18px}
  #products .fmt{font-size:14px}
  #products .foot{padding:6px 14px 12px}
  #bundles{grid-template-columns:minmax(0,1fr)}

  /* bigger touch targets */
  summary{padding:10px 0;min-height:44px;align-items:center}
  .qty button{width:40px;height:40px}
  th,td{padding:10px 8px}

  /* assistant: round button, full-width sheet */
  .bot-btn{right:14px;bottom:max(14px,env(safe-area-inset-bottom));width:56px;height:56px;padding:0;border-radius:50%;justify-content:center}
  .bot-btn span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .bot-btn svg{width:24px;height:24px}
  .bot-btn[aria-expanded="true"], body.cart-open .bot-btn{display:none}
  .bot{left:0;right:0;bottom:0;width:100%;height:88vh;height:88dvh;border-radius:var(--r-l) var(--r-l) 0 0}
  footer{padding-bottom:84px}
  .toast{top:auto;bottom:max(84px,calc(env(safe-area-inset-bottom) + 76px));transform:translate(-50%,160px);white-space:normal;text-align:center;max-width:calc(100% - 40px)}
}
@media (max-width:370px){
  .bar{gap:6px}
  .brand{gap:6px;min-width:0}
  .brand svg{width:28px;height:auto}
  .brand b{font-size:19px}
  .lang button{min-width:34px;padding:5px 6px}
  .cart-btn{padding:9px 10px;gap:6px}
}
@media (max-width:480px){
  .two-in{grid-template-columns:minmax(0,1fr)}
}
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="brand" href="#top" aria-label="Armonia">
      <svg width="40" height="34" viewBox="0 0 40 34" aria-hidden="true">
        <path d="M2 32 A18 18 0 0 1 38 32 Z" fill="#2E6B45"/>
        <path d="M2 32 L11 17 L20 32 L29 17 L38 32 M11 17 L20 14 L29 17 M20 14 L20 32 M6 24 L11 17 M34 24 L29 17 M6 24 L34 24" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M20 14 C20 8 24 4 30 3 C30 9 26 13 20 14 Z" fill="#D9C58A"/>
      </svg>
      <span><b>Armonia</b><small data-i18n="brandSub"></small></span>
    </a>
    <nav class="main" aria-label="Menu">
      <a href="#noleggio" data-i18n="navRent"></a>
      <a href="#torre" data-i18n="navTower"></a>
      <a href="#negozio" data-i18n="navShop"></a>
      <a href="#unife" data-i18n="navUni"></a>
      <a href="#nichel" data-i18n="navNickel"></a>
    </nav>
    <div class="tools">
      <div class="lang" role="group" aria-label="Lingua / Language">
        <button type="button" data-lang="it" aria-pressed="true">IT</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <button class="cart-btn" type="button" id="openCart">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 8h14l-1.5 12h-11z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
        <span class="lbl" data-i18n="cart"></span><span class="count" id="cartCount">0</span>
      </button>
    </div>
  </div>
  <nav class="subnav" aria-label="Menu">
    <a href="#noleggio" data-i18n="navRent"></a>
    <a href="#torre" data-i18n="navTower"></a>
    <a href="#negozio" data-i18n="navShop"></a>
    <a href="#unife" data-i18n="navUni"></a>
    <a href="#nichel" data-i18n="navNickel"></a>
  </nav>
</header>

<main id="top">
<section class="hero">
  <div class="wrap">
    <div>
      <h1 data-i18n="slogan"></h1>
      <p class="lead" data-i18n="heroLead"></p>
      <div class="ctas">
        <a class="btn" href="#noleggio" data-i18n="heroCta1"></a>
        <a class="btn ghost" href="#negozio" data-i18n="heroCta2"></a>
      </div>
      <ul class="facts">
        <li><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#355F7A" stroke-width="2" aria-hidden="true"><path d="M9 3h6M10 3v6L5 19a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2l-5-10V3"/><path d="M7.5 15h9"/></svg><span data-i18n="fact1"></span></li>
        <li><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2E6B45" stroke-width="2" aria-hidden="true"><path d="M12 21s-7-5.5-7-11a7 7 0 0 1 14 0c0 5.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg><span data-i18n="fact2"></span></li>
        <li><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1B2A24" stroke-width="2" aria-hidden="true"><path d="M3 21h18M5 21V10l7-5 7 5v11"/><path d="M9 21v-6h6v6"/></svg><span data-i18n="fact3"></span></li>
      </ul>
    </div>
    <div class="hero-tower">
      <div id="heroTower"></div>
      <p data-i18n="heroTowerCap"></p>
      <p class="hint" data-i18n="hotHint"></p>
    </div>
  </div>
</section>

<section id="come">
  <div class="wrap">
    <div class="sec-head"><h2 data-i18n="howTitle"></h2></div>
    <ol class="steps">
      <li><h3 data-i18n="how1t"></h3><p data-i18n="how1"></p></li>
      <li><h3 data-i18n="how2t"></h3><p data-i18n="how2"></p></li>
      <li><h3 data-i18n="how3t"></h3><p data-i18n="how3"></p></li>
    </ol>
  </div>
</section>

<section id="noleggio">
  <div class="wrap">
    <div class="sec-head"><h2 data-i18n="rentTitle"></h2><p class="lead" data-i18n="rentLead"></p></div>
    <div class="rent">
      <div class="tower-stage">
        <div id="rentTower"></div>
        <div class="legend" id="legend"></div>
        <div class="giftcard" id="giftCard" hidden></div>
      </div>
      <form class="cfg" id="cfg" onsubmit="return false">
        <fieldset>
          <legend data-i18n="rentQ0"></legend>
          <div class="opts" id="modes"></div>
        </fieldset>
        <fieldset>
          <legend data-i18n="rentQ1"></legend>
          <div class="opts" id="formats"></div>
          <div class="range-row" id="holesRow">
            <label for="holes" style="white-space:nowrap" id="holesLabel"></label>
            <input type="range" id="holes" min="4" max="17" value="6">
          </div>
        </fieldset>
        <fieldset>
          <legend data-i18n="rentQ2"></legend>
          <div class="crops" id="crops" role="group"></div>
          <p class="fine" data-i18n="rentCropNote"></p>
        </fieldset>
        <fieldset>
          <legend data-i18n="rentQ3"></legend>
          <div class="opts" id="durations"></div>
        </fieldset>
        <div class="field" style="max-width:360px">
          <label for="towerName" data-i18n="rentName"></label>
          <input id="towerName" maxlength="18" autocomplete="off">
        </div>
        <div class="giftfields" id="giftFields">
          <div class="field"><label for="giftTo" data-i18n="giftTo"></label><input id="giftTo" maxlength="24" autocomplete="off"></div>
          <div class="field"><label for="giftMsg" data-i18n="giftMsg"></label><textarea id="giftMsg" rows="2" maxlength="140"></textarea></div>
        </div>
        <div class="summary">
          <div>
            <div class="price" id="rentPrice"></div>
            <p class="fine" id="rentFine"></p>
          </div>
          <button class="btn" type="button" id="rentAdd" style="background:var(--sun);color:var(--field)"></button>
        </div>
      </form>
    </div>
  </div>
</section>

<section id="torre">
  <div class="wrap">
    <div class="sec-head"><h2 data-i18n="towerTitle"></h2><p class="lead" data-i18n="towerLead"></p></div>
    <div class="live">
      <div class="live-tower"><div id="liveTower"></div><p class="note" id="liveDay"></p></div>
      <div class="live-main">
        <div class="metrics" id="metrics"></div>
        <div class="chart"><div class="chart-head"><b data-i18n="growthT"></b><span class="note" data-i18n="growthD"></span></div><svg id="growth" viewBox="0 0 600 170" role="img"></svg></div>
        <div class="report">
          <div class="report-head"><b data-i18n="reportT"></b><button class="btn small" type="button" id="reportBtn" data-i18n="reportBtn"></button></div>
          <p id="reportText" aria-live="polite"></p>
          <p class="note" id="reportNote"></p>
        </div>
        <div class="next" id="nextBox"></div>
      </div>
    </div>
    <p class="note" data-i18n="towerDemo"></p>
  </div>
</section>


<section id="unife">
  <div class="wrap unife">
    <div>
      <div class="sec-head"><h2 data-i18n="uniTitle"></h2><p class="lead" data-i18n="uniLead"></p></div>
      <ul>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" aria-hidden="true"><path d="M4 10h16l-1-5H5zM5 10v10h14V10M9 20v-5h6v5"/></svg><div><h3 data-i18n="uni1t"></h3><p data-i18n="uni1"></p></div></li>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" aria-hidden="true"><path d="M7 3v8a5 5 0 0 0 10 0V3M12 16v5M8 21h8"/></svg><div><h3 data-i18n="uni2t"></h3><p data-i18n="uni2"></p></div></li>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/></svg><div><h3 data-i18n="uni3t"></h3><p data-i18n="uni3"></p></div></li>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" aria-hidden="true"><path d="M2 20a10 10 0 0 1 20 0z"/><path d="M7 20l5-9 5 9M5 15h14"/></svg><div><h3 data-i18n="uni4t"></h3><p data-i18n="uni4"></p></div></li>
      </ul>
    </div>
    <div class="ticket">
      <p class="muted" data-i18n="uniNext"></p>
      <p class="when" data-i18n="uniWhen"></p>
      <p data-i18n="uniWhere"></p>
      <hr style="border:0;border-top:1px dashed var(--line);width:100%;margin:6px 0">

    </div>
  </div>
</section>

<section id="negozio" style="padding-top:20px">
  <div class="wrap">
    <div class="sec-head"><h2 data-i18n="shopTitle"></h2><p class="lead" data-i18n="shopLead"></p></div>
    <div class="filters" id="filters" role="group"></div>
    <div class="grid" id="products"></div>
  </div>
</section>

<section id="abbonamenti" style="background:var(--alt);border-block:1px solid var(--line)">
  <div class="wrap">
    <div class="sec-head"><h2 data-i18n="subsTitle"></h2><p class="lead" data-i18n="subsLead"></p></div>
    <div class="plans" id="plans"></div>
    <div class="addon">
      <div><h3 data-i18n="addonT"></h3><p class="muted" data-i18n="addonD"></p></div>
      <div style="display:flex;gap:16px;align-items:center"><button class="btn berry small" type="button" id="addonBtn" data-i18n="addCart"></button></div>

  </div>
</section>

<section id="bundle">
  <div class="wrap">
    <div class="sec-head"><h2 data-i18n="bundTitle"></h2><p class="lead" data-i18n="bundLead"></p></div>
    <div class="filters" id="bundleTabs" role="group"></div>
    <div class="grid" id="bundles"></div>
  </div>
</section>



<section id="richiesta">
  <div class="wrap request">
    <div class="sec-head" style="margin:0">
      <h2 data-i18n="reqTitle"></h2>
      <p class="lead" data-i18n="reqLead"></p>
      <ol class="process">
        <li data-i18n-html="req1"></li>
        <li data-i18n-html="req2"></li>
        <li data-i18n-html="req3"></li>
        <li data-i18n-html="req4"></li>
      </ol>
    </div>
    <form class="form" id="reqForm">
      <div class="field"><label for="rq1" data-i18n="reqF1"></label><input id="rq1" required data-i18n-ph="reqF1ph"></div>
      <div class="two">
        <div class="field"><label for="rq2" data-i18n="reqF2"></label><select id="rq2"></select></div>
        <div class="field"><label for="rq3" data-i18n="reqF3"></label><select id="rq3"><option>3</option><option>6</option><option>12</option></select></div>
      </div>
      <div class="field"><label for="rq4" data-i18n="reqF4"></label><input id="rq4" type="email" required autocomplete="email"></div>
      <div class="field"><label for="rq5" data-i18n="reqF5"></label><textarea id="rq5" rows="3"></textarea></div>
      <button class="btn" type="submit" data-i18n="reqSend"></button>
      <div id="reqOk" class="ok" hidden></div>
    </form>
  </div>

<section id="premi" style="padding-top:20px">

 return {f, holes, monthly, total:monthly*R.months};
}

function seeded(str){ let h = 2166136261; for (const ch of str){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 1000) / 1000; }; }

}

function cartMath(){
 let sub = 0, monthly = 0, leafTrays = 0, leafKg = 0, eligible = 0;
 S.cart.forEach(it => {
  const i = itemInfo(it); sub += i.price*it.qty;
  if (i.recurring) { monthly += i.price*it.qty; eligible += i.price*it.qty; }

 });

async function callClaude(system, messages, onText){
 const mode = aiMode();
 if (mode === "claude"){
  const convo = messages.map(m => (m.role==="user" ? "Utente: " : "Assistente: ") + m.content).join("\n");
  const r = await sampleFn(system + "\n\nCONVERSAZIONE\n" + convo + "\nAssistente:", {modelTier:"quick", cache:false, onText: onText ? (x => onText(x.text)) : undefined});
  return r.text;
 }
 if (mode === "proxy"){
  try {
   const r = await fetch(CFG.proxyUrl, {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify({system, messages})});
   if (r.status === 404 || r.status === 405){ proxyOk = false; updateBotSub(); return callClaude(system, messages, onText); }
   const d = await r.json(); if (!r.ok) throw new Error(d.error || r.status); proxyOk = true; return d.text;
  } catch(e){ if (proxyOk === null){ proxyOk = false; updateBotSub(); return callClaude(system, messages, onText); } throw e; }
 }
 if (mode === "key"){
  const r = await fetch("https://api.anthropic.com/v1/messages", {method:"POST", headers:{"x-api-key":CFG.apiKey, "anthropic-version":CFG.apiVersion || "2023-06-01", "content-type":"application/json", "anthropic-dangerous-direct-browser-access":"true"},
   body:JSON.stringify({model:CFG.model || "claude-haiku-5-5", max_tokens:400, system, messages})});
  const d = await r.json(); if (!r.ok) throw new Error(d?.error?.message || r.status);
  return d.content.filter(b => b.type==="text").map(b => b.text).join("");
 }
 return null;
}
let busy = false;
async function ask(q){
 if (!q.trim() || busy) return;
 busy = true; say(q, "me");
 const bubble = say("…", "it");
 history.push({role:"user", content:q.slice(0, 600)});
 let text = null;
 try { text = await callClaude(knowledge(), history.slice(-8), x => { bubble.textContent = x; $("#msgs").scrollTop = 1e6; }); }
 catch(e){ text = t("botErr") + answer(q); }
 if (!text) { await new Promise(r => setTimeout(r, 400)); text = answer(q); }
 bubble.textContent = text; $("#msgs").scrollTop = 1e6;
 history.push({role:"assistant", content:text});
 busy = false;
}

 try { if (window.claude && typeof window.claude.use === "function"){ sampleFn = await window.claude.use("sample"); } } catch(e){ sampleFn = null; }

 const rows = DEMO_PICK.map(r => [L(r.who), L(r.what)]).concat(S.reservations.map(r => [r.who, r.what]));
 $("#ciasPick").innerHTML = rows.map(([w, x]) => `<tr><td>${esc(w)}</td><td>${esc(x)}</td></tr>`).join("");
 if (!$("#ciasMsg").dataset.ai) { $("#ciasMsg").textContent = mondayTemplate(); $("#ciasNote").textContent = aiMode()==="faq" ? t("ciasFaq") : ""; }
}
function available(){ return PRODUCTS.filter(p => (S.stock[p.id] ?? 0) > 0 && p.id!=="box").map(p => ({nome:L(p.name), vaschette:S.stock[p.id]})); }
function mondayTemplate(){
 const n = available().map(a => a.nome.toLowerCase());
 const list = n.length > 1 ? n.slice(0, -1).join(", ") + (lang==="it" ? " e " : " and ") + n[n.length-1] : (n[0] || (lang==="it" ? "solo la Box del giovedì" : "only the Thursday box"));
 const url = location.href.split("#")[0];
 return lang==="it"
  ? `Buongiorno! Questa settimana in cupola raccogliamo: ${list}.\nLa Box del giovedì: 3 vaschette scelte da noi. Prenota entro mercoledì sera: ${url}\nRitiro giovedì dalle 16 alle 19 alla cupola Armonia. Tutto nichel testato.`
  : `Good morning! This week the dome is harvesting: ${list}.\nThe Thursday box: 3 trays we pick for you. Reserve by Wednesday evening: ${url}\nPickup Thursday 4 to 7 pm at the Armonia dome. All nickel tested.`;
}
async function writeMonday(){
 const box = $("#ciasMsg"), note = $("#ciasNote");
 box.dataset.ai = "";
 if (aiMode()==="faq"){ box.textContent = mondayTemplate(); note.textContent = t("ciasFaq"); return; }
 box.textContent = t("ciasWait"); note.textContent = "";
 const system = `Scrivi il messaggio del lunedì per il canale WhatsApp di Armonia, la serra di ricerca del CIAS a Ferrara. Scrivi in ${lang==="it" ? "italiano" : "inglese"}, al massimo 5 righe, tono semplice e caldo, senza markdown e senza emoji. Usa SOLO i dati: cosa si raccoglie questa settimana e quante vaschette, la Box del giovedì con 3 vaschette scelte dalla serra (senza prezzi), prenotazione entro mercoledì sera al link, ritiro giovedì dalle 16 alle 19 alla cupola. Puoi dire «nichel testato», mai «sicuro per gli allergici». Non usare mai parole come avanzi, eccedenze, surplus o sorpresa.`;
 try {
  const txt = await callClaude(system, [{role:"user", content:JSON.stringify({disponibili:available(), link:location.href.split("#")[0]})}], x => { box.textContent = x; });
  box.textContent = txt || mondayTemplate(); note.textContent = txt ? t("ciasAI") : t("ciasFaq"); if (txt) box.dataset.ai = "1";
 } catch(e){ box.textContent = mondayTemplate(); note.textContent = t("ciasFaq"); }
}
document.addEventListener("input", e => {
 const id = e.target.dataset && e.target.dataset.stock;
 if (id){ S.stock[id] = Math.max(0, Math.min(99, +e.target.value || 0)); renderShop(); if (!$("#ciasMsg").dataset.ai) $("#ciasMsg").textContent = mondayTemplate(); }
});
$("#ciasMsgBtn").addEventListener("click", writeMonday);
$("#ciasCopy").addEventListener("click", async () => {
 try { await navigator.clipboard.writeText($("#ciasMsg").textContent); $("#ciasNote").textContent = t("ciasCopied"); }
 catch(e){ $("#ciasNote").textContent = t("ciasCopyFail"); }
});


/* ---------- phone behaviour ---------- */
(() => {
 const mq = matchMedia("(max-width:720px)");
 const card = document.getElementById("giftCard"), stage = document.querySelector(".tower-stage"), sum = document.querySelector("#cfg .summary");
 const place = () => { if (!card || !stage || !sum) return; if (mq.matches){ if (card.parentElement !== sum.parentElement) sum.before(card); } else if (card.parentElement !== stage) stage.append(card); };
 place(); mq.addEventListener("change", place);
 const h = document.querySelector("header"); let last = scrollY;
 addEventListener("scroll", () => {
  const y = scrollY;
  if (!mq.matches || h.contains(document.activeElement)) h.classList.remove("away");
  else if (y > last + 6 && y > 140) h.classList.add("away");
  else if (y < last - 6) h.classList.remove("away");
  last = y;
 }, {passive:true});
 new MutationObserver(() => document.body.classList.toggle("cart-open", !!document.querySelector(".drawer.on"))).observe(document.querySelector(".drawer"), {attributes:true, attributeFilter:["class"]});
})();
/* ---------- plant cards ---------- */
const tip = document.createElement("div");
tip.className = "ptip"; tip.id = "plantTip"; tip.setAttribute("role", "tooltip"); tip.hidden = true;
document.body.append(tip);
let tipFor = null, tipTimer = 0;
function plantIcon(crop){
 const u = "ic" + crop + "_", Lf = LEAF[crop];
 const defs = `<linearGradient id="${u}${crop}" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="${Lf.a}"/><stop offset="1" stop-color="${Lf.b}"/></linearGradient><linearGradient id="${u}${crop}d" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="${mix(Lf.a, .72)}"/><stop offset="1" stop-color="${mix(Lf.b, .78)}"/></linearGradient><radialGradient id="berry" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#F0525A"/><stop offset=".6" stop-color="#C62A36"/><stop offset="1" stop-color="#8E1823"/></radialGradient>`;
 return `<svg viewBox="-34 -42 68 68" aria-hidden="true"><defs>${defs}</defs><ellipse cx="0" cy="13" rx="11" ry="3.5" fill="#26302B"/>${plantSVG(u, crop, 0, 11, 0, 1.05, rng(11))}</svg>`;
}
function showTip(svg, crop, anchorEl){
 clearTimeout(tipTimer);
 const info = PLANT_INFO[crop]; if (!info) return;
 svg.classList.add("focus");
 svg.querySelectorAll("[data-crop]").forEach(el => el.classList.toggle("on", el.dataset.crop === crop));
 const dot = svg.querySelector(`.hotdot[data-crop="${crop}"]`), n = dot ? +dot.dataset.n : 0;
 const inTower = svg.closest("#rentTower, #liveTower") && n ? `<span class="chip2">${t("tipIn", {n: lang === "it" ? `${n} ${n === 1 ? "posto" : "posti"}` : `${n} slot${n === 1 ? "" : "s"}`})}</span>` : "";
 const [a, b] = info.d, Lf = LEAF[crop], max = 90;
 tip.innerHTML = `<div class="ptip-head"><span class="ptip-ic">${plantIcon(crop)}</span><div><b class="n">${esc(L(CROPS[crop]))}</b><i class="l">${esc(info.lat)}</i></div></div>
  <div class="ptip-grow"><span>${t("tipGrow")}</span><b>${t("tipDays", {a, b})}</b></div>
  <div class="ptip-bar"><i style="left:0;width:${a / max * 100}%;background:${Lf.a}"></i><i style="left:${a / max * 100}%;width:${(b - a) / max * 100}%;background:${Lf.b};opacity:.7"></i></div>
  <div class="ptip-scale"><span>0</span><span>${t("tipMax")}</span></div>
  <p>${esc(lang === "it" ? info.it : info.en)}</p>${inTower}
  <div class="ptip-scale" style="margin-top:8px">${t("tipFoot")}</div>`;
 tip.hidden = false; tipFor = svg;
 const hit = (svg.querySelector(`.pl.hot[data-crop="${crop}"] .hit`) || anchorEl).getBoundingClientRect();
 const W = tip.offsetWidth, H = tip.offsetHeight, m = 10;
 let x = hit.right + 12, y = hit.top + hit.height / 2 - H / 2;
 if (x + W > innerWidth - m) x = hit.left - 12 - W;
 if (x < m){ x = Math.max(m, Math.min(innerWidth - W - m, hit.left + hit.width / 2 - W / 2)); y = hit.bottom + 8; if (y + H > innerHeight - m) y = hit.top - 8 - H; }
 tip.style.left = Math.round(x) + "px"; tip.style.top = Math.round(Math.max(m, Math.min(innerHeight - H - m, y))) + "px";
 requestAnimationFrame(() => tip.classList.add("on"));
}
function hideTip(){
 tip.classList.remove("on"); tip.hidden = true;
 document.querySelectorAll("svg.tw.focus").forEach(sv => { sv.classList.remove("focus"); sv.querySelectorAll(".on").forEach(el => el.classList.remove("on")); });
 tipFor = null;
}
const hotOf = e => e.target.closest && e.target.closest("svg.tw .pl.hot, svg.tw .hotdot, svg.tw .lbl");
document.addEventListener("pointerover", e => { if (e.pointerType !== "mouse") return; const h = hotOf(e); if (h) showTip(h.ownerSVGElement || h.closest("svg"), h.dataset.crop, h); });
document.addEventListener("pointerout", e => { if (e.pointerType !== "mouse") return; const h = hotOf(e); if (h && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest(`[data-crop="${h.dataset.crop}"]`))) tipTimer = setTimeout(hideTip, 90); });
let lastPT = "mouse";
document.addEventListener("pointerdown", e => { lastPT = e.pointerType || "mouse"; }, true);
document.addEventListener("click", e => {
 const h = hotOf(e);
 if (h){ const sv = h.ownerSVGElement || h.closest("svg"); if (lastPT !== "mouse" && tipFor === sv && h.classList.contains("on")) hideTip(); else showTip(sv, h.dataset.crop, h); }
 else if (tipFor) hideTip();
});
document.addEventListener("focusin", e => { const h = e.target.closest && e.target.closest("svg.tw .pl.hot"); if (h) showTip(h.ownerSVGElement, h.dataset.crop, h); });
document.addEventListener("focusout", e => { if (e.target.closest && e.target.closest("svg.tw .pl.hot")) hideTip(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && tipFor) hideTip(); else if ((e.key === "Enter" || e.key === " ") && e.target.closest && e.target.closest("svg.tw .pl.hot")) e.preventDefault(); });
addEventListener("scroll", () => { if (tipFor) hideTip(); }, {passive:true});
addEventListener("resize", () => { if (tipFor) hideTip(); });

function renderAll(){ renderText(); updateBotSub && $('#botSub') && updateBotSub(); renderShop(); renderPlans(); renderBundles(); renderRent(); renderInfo(); renderCart(); renderBotChrome(); $('#ciasMsg').dataset.ai = ''; renderCias(); }
renderAll();
</script>
</body>
